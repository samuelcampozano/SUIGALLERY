# ========================================================
# RENDER BLUEPRINT SPECIFICATION (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec
# ========================================================

databases:
  - name: nodus-sandbox-db
    databaseName: nodus_sandbox
    user: nodus
    plan: free
    region: oregon
    postgresMajorVersion: "16"
  - name: nodus-prod-db
    databaseName: nodus
    user: nodus
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # ------------------------------------------------------
  # 1. DEVELOPMENT / STAGING ENVIRONMENT (Branch: dev)
  # ------------------------------------------------------
  - type: web
    name: nodus-dev
    runtime: docker
    plan: free
    region: oregon
    branch: dev
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NODUS_DEPLOYMENT_ENV
        value: sandbox
      - key: WALRUS_DIRECT_TESTNET_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nodus-sandbox-db
          property: connectionString
      - key: CONSOLE_API_BASE_URL
        value: https://api.console.walrus.xyz
      - key: CONSOLE_MCP_ALLOWED_DIRS
        value: /app
      - key: CONSOLE_API_KEY
        sync: false
      - key: CONSOLE_SERVICE_PRIVATE_KEY
        sync: false
      - key: CONSOLE_WEB_ACCOUNT_ADDRESS
        sync: false
      - key: NODUS_ALLOWED_ORIGINS
        sync: false
      - key: NODUS_PROVISIONING_ADMIN_TOKEN
        sync: false
      - key: NODUS_TENANT_PROVISIONER_URL
        sync: false
      - key: NODUS_TENANT_PROVISIONER_TOKEN
        sync: false

  # ------------------------------------------------------
  # 2. PRODUCTION ENVIRONMENT (Branch: main)
  # ------------------------------------------------------
  - type: web
    name: nodus-prod
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NODUS_DEPLOYMENT_ENV
        value: production
      - key: WALRUS_DIRECT_TESTNET_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nodus-prod-db
          property: connectionString
      - key: CONSOLE_API_BASE_URL
        value: https://api.console.walrus.xyz
      - key: CONSOLE_MCP_ALLOWED_DIRS
        value: /app
      - key: CONSOLE_API_KEY
        sync: false
      - key: CONSOLE_SERVICE_PRIVATE_KEY
        sync: false
      - key: CONSOLE_WEB_ACCOUNT_ADDRESS
        sync: false
      - key: NODUS_ALLOWED_ORIGINS
        sync: false
      - key: NODUS_PROVISIONING_ADMIN_TOKEN
        sync: false
      - key: NODUS_TENANT_PROVISIONER_URL
        sync: false
      - key: NODUS_TENANT_PROVISIONER_TOKEN
        sync: false
