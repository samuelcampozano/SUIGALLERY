services:
  nodus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodus-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - CONSOLE_MCP_ALLOWED_DIRS=/app
    volumes:
      - ./temp_storage:/app/temp_storage
      - ./public:/app/public
      - ./server:/app/server
      - ./sdk:/app/sdk
