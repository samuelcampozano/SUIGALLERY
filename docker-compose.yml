services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nodus
      POSTGRES_USER: nodus
      POSTGRES_PASSWORD: nodus_dev_only
    ports:
      - "5432:5432"
    volumes:
      - nodus-postgres:/var/lib/postgresql/data
      - ./server/migrations/001_auth_tenants.sql:/docker-entrypoint-initdb.d/001_auth_tenants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodus -d nodus"]
      interval: 5s
      timeout: 5s
      retries: 12
  nodus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodus-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - CONSOLE_MCP_ALLOWED_DIRS=/app
      - DATABASE_URL=${DATABASE_URL:-postgres://nodus:nodus_dev_only@postgres:5432/nodus}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./temp_storage:/app/temp_storage
      - ./public:/app/public
      - ./server:/app/server
      - ./sdk:/app/sdk

volumes:
  nodus-postgres:
