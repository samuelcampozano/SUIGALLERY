name: Nodus CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Nodus Automated Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run All Automated Test Suites
        run: npm test

  deploy:
    name: Continuous Deployment to Render Cloud
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SERVICE_ID="${{ github.ref == 'refs/heads/dev' && 'srv-daotpc6gekts73f1p560' || 'srv-daotpfjtqb8s73ejacfg' }}"
          if [ -n "$RENDER_API_KEY" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d "{}" "https://api.render.com/v1/services/$SERVICE_ID/deploys"
          fi
